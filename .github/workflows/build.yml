name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyTube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mytube-debug-${{ github.sha }}
          path: MyTube.apk
          if-no-files-found: error

      # Every build of main becomes a release, so
      # https://github.com/<owner>/<repo>/releases/latest/download/MyTube.apk always serves the newest one.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          short_sha="${GITHUB_SHA::7}"
          gh release create "$tag" MyTube.apk \
            --target "$GITHUB_SHA" \
            --title "MyTube build ${GITHUB_RUN_NUMBER} (${short_sha})" \
            --notes "Debug build of ${short_sha}: $(git log -1 --pretty=%s)" \
            --latest
